services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/dev-data
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/postgres/migrations:/db-migrations:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  tasks:
    build:
      context: .
      args:
        SERVICE: tasks
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-localdev}@postgres:5432/tasks?sslmode=disable
      REDIS_ADDR: redis:6379
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 15s

  habits:
    build:
      context: .
      args:
        SERVICE: habits
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-localdev}@postgres:5432/habits?sslmode=disable
      REDIS_ADDR: redis:6379
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 15s

