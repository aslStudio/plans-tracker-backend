services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${PROD_POSTGRES_PASSWORD:?Set PROD_POSTGRES_PASSWORD for production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data

  accounts:
    environment:
      DATABASE_URL: postgres://app@postgres:5432/accounts?sslmode=disable
      TASKS_DATABASE_URL: postgres://app@postgres:5432/tasks?sslmode=disable
      HABITS_DATABASE_URL: postgres://app@postgres:5432/habits?sslmode=disable
      CALENDAR_DATABASE_URL: postgres://app@postgres:5432/calendar?sslmode=disable
      DATABASE_PASSWORD: ${PROD_POSTGRES_PASSWORD:?Set PROD_POSTGRES_PASSWORD for production}

  tasks:
    environment:
      DATABASE_URL: postgres://app@postgres:5432/tasks?sslmode=disable
      DATABASE_PASSWORD: ${PROD_POSTGRES_PASSWORD:?Set PROD_POSTGRES_PASSWORD for production}

  habits:
    environment:
      DATABASE_URL: postgres://app@postgres:5432/habits?sslmode=disable
      DATABASE_PASSWORD: ${PROD_POSTGRES_PASSWORD:?Set PROD_POSTGRES_PASSWORD for production}

  calendar:
    environment:
      DATABASE_URL: postgres://app@postgres:5432/calendar?sslmode=disable
      DATABASE_PASSWORD: ${PROD_POSTGRES_PASSWORD:?Set PROD_POSTGRES_PASSWORD for production}

volumes:
  postgres_data:
